name: Fork sync & release

# Keeps this fork tracking upstream (can1357/oh-my-pi) and publishes binary
# releases that `omp update` on our machines installs from.
#
# Flow, on every trigger (nightly cron, manual dispatch, push to main):
#   1. sync    — fetch upstream tags, merge the latest stable `vX.Y.Z` tag
#                into main (fork patches ride on top), push. A merge conflict
#                fails the run: resolve locally, push, re-run.
#   2. build   — compile omp binaries for the platforms we actually run
#                (darwin-arm64 Mac, linux-x64 VMs). Native addons are NOT
#                built from source: they are taken from the upstream base
#                release's npm leaf packages, so fork patches must stay on the
#                TypeScript side (Rust changes would require the upstream
#                bazel pipeline).
#   3. publish — tag `vX.Y.Z-fork.N` (X.Y.Z = upstream base, N = build counter
#                on that base) and create a GitHub release with the binaries.
#
# Pushes made by this workflow use GITHUB_TOKEN and therefore never retrigger
# it (no loop). A run where main is already released is a cheap no-op.

on:
   schedule:
      - cron: "17 9 * * *"
   workflow_dispatch:
      inputs:
         force_release:
            description: "Release even if HEAD is already tagged (bumps -fork.N)"
            type: boolean
            default: false
   push:
      branches: [main]

concurrency:
   group: fork-release
   cancel-in-progress: false

permissions:
   contents: write

env:
   UPSTREAM_REPO: can1357/oh-my-pi

jobs:
   sync:
      name: Merge latest upstream tag
      runs-on: ubuntu-24.04
      outputs:
         sha: ${{ steps.plan.outputs.sha }}
         base: ${{ steps.plan.outputs.base }}
         version: ${{ steps.plan.outputs.version }}
         need-release: ${{ steps.plan.outputs.need-release }}
      steps:
         - uses: actions/checkout@v4
           with:
              ref: main
              fetch-depth: 0
         - name: Merge latest upstream stable tag
           run: |
              git config user.name "fork-release[bot]"
              git config user.email "fork-release@users.noreply.github.com"
              git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
              git fetch --no-tags upstream '+refs/tags/v*:refs/tags/v*'
              latest=$(git tag -l 'v[0-9]*' | grep -v -- '-' | sort -V | tail -n1)
              if [ -z "$latest" ]; then echo "::error::no upstream stable tag found"; exit 1; fi
              echo "latest upstream stable tag: $latest"
              if git merge-base --is-ancestor "$latest" HEAD; then
                echo "$latest already merged"
              else
                if ! git merge --no-edit -m "chore: merge upstream $latest" "$latest"; then
                  echo "::error::merge of $latest conflicts with fork patches — resolve locally (git fetch upstream && git merge $latest), push main, then re-run this workflow"
                  exit 1
                fi
                git push origin main
              fi
         - name: Plan release version
           id: plan
           env:
              FORCE_RELEASE: ${{ inputs.force_release && 'true' || 'false' }}
           run: |
              sha=$(git rev-parse HEAD)
              base=$(git tag -l 'v[0-9]*' --merged HEAD | grep -v -- '-' | sort -V | tail -n1)
              base=${base#v}
              # highest existing -fork.N counter on this base (fork tags come from origin)
              n=$(git tag -l "v${base}-fork.*" | sed -n 's/^v.*-fork\.\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n1)
              next=$(( ${n:-0} + 1 ))
              version="${base}-fork.${next}"
              if git tag -l --points-at HEAD | grep -q -- '-fork\.' && [ "$FORCE_RELEASE" != "true" ]; then
                need=false
              else
                need=true
              fi
              {
                echo "sha=$sha"
                echo "base=$base"
                echo "version=$version"
                echo "need-release=$need"
              } >> "$GITHUB_OUTPUT"
              echo "sha=$sha base=$base version=$version need-release=$need"

   build:
      name: "Build: ${{ matrix.target_id }}"
      needs: [sync]
      if: needs.sync.outputs.need-release == 'true'
      strategy:
         fail-fast: true
         matrix:
            include:
               - target_id: darwin-arm64
                 os: macos-14
                 natives_pkg: pi-natives-darwin-arm64
                 binary: omp-darwin-arm64
               - target_id: linux-x64
                 os: ubuntu-24.04
                 natives_pkg: pi-natives-linux-x64
                 binary: omp-linux-x64
      runs-on: ${{ matrix.os }}
      steps:
         - uses: actions/checkout@v4
           with:
              ref: ${{ needs.sync.outputs.sha }}
         - uses: oven-sh/setup-bun@v2
           with:
              bun-version: "1.3.14"
         - name: Install dependencies
           run: bun install --frozen-lockfile
         - name: Fetch native addons from upstream base release (npm)
           run: |
              pkg="${{ matrix.natives_pkg }}"
              base="${{ needs.sync.outputs.base }}"
              curl -fsSL --retry 3 "https://registry.npmjs.org/@oh-my-pi/${pkg}/-/${pkg}-${base}.tgz" | tar -xz -C "$RUNNER_TEMP"
              cp "$RUNNER_TEMP"/package/pi_natives.*.node packages/natives/native/
              ls -la packages/natives/native/*.node
         - name: Set fork version
           run: bun scripts/fork-set-version.ts "${{ needs.sync.outputs.version }}"
         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target_id }}
           run: bun run ci:release:build-binaries
         - name: Smoke binary
           run: |
              runtime_dir="$(mktemp -d)"
              reported=$(HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "packages/coding-agent/binaries/${{ matrix.binary }}" --version)
              echo "reported: $reported"
              case "$reported" in
                *"${{ needs.sync.outputs.version }}"*) ;;
                *) echo "::error::binary reports '$reported', expected ${{ needs.sync.outputs.version }}"; exit 1 ;;
              esac
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "packages/coding-agent/binaries/${{ matrix.binary }}" --smoke-test
         - name: Upload binary artifact
           uses: actions/upload-artifact@v4
           with:
              name: omp-binary-${{ matrix.target_id }}
              path: packages/coding-agent/binaries/${{ matrix.binary }}
              if-no-files-found: error
              retention-days: 3

   publish:
      name: Publish GitHub release
      needs: [sync, build]
      if: needs.sync.outputs.need-release == 'true'
      runs-on: ubuntu-24.04
      steps:
         - uses: actions/checkout@v4
           with:
              ref: ${{ needs.sync.outputs.sha }}
              fetch-depth: 0
         - name: Download binaries
           uses: actions/download-artifact@v4
           with:
              pattern: omp-binary-*
              merge-multiple: true
              path: binaries
         - name: Create release
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              VERSION: ${{ needs.sync.outputs.version }}
              BASE: ${{ needs.sync.outputs.base }}
              SHA: ${{ needs.sync.outputs.sha }}
           run: |
              git fetch --no-tags "https://github.com/${UPSTREAM_REPO}.git" "+refs/tags/v${BASE}:refs/tags/v${BASE}" || true
              {
                echo "Upstream base: [v${BASE}](https://github.com/${UPSTREAM_REPO}/releases/tag/v${BASE})"
                echo
                echo "Fork commits on top of the base:"
                echo
                git log --no-merges --pretty='- %h %s' "v${BASE}..${SHA}" || true
              } > notes.md
              chmod +x binaries/omp-*
              gh release create "v${VERSION}" \
                --target "$SHA" \
                --title "omp v${VERSION}" \
                --notes-file notes.md \
                binaries/omp-*
